name: PinPlan lightweight DEB CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-gi libgtk-4-dev libadwaita-1-dev meson ninja-build gettext libglib2.0-dev-bin gir1.2-gtk-4.0 gir1.2-adw-1 dpkg-dev desktop-file-utils xvfb dbus-x11 openbox
      - name: Validate Python and schema
        run: |
          python3 -m compileall -q src/betternotes
          glib-compile-schemas --strict --dry-run data/
          PYTHONPATH=src /usr/bin/python3 -m unittest discover -s tests -v
      - name: Validate README screenshot assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          readme = Path("README.md").read_text(encoding="utf-8")
          for name in ("home", "plan", "note", "preferences"):
              path = Path("assets/screenshots") / (name + ".webp")
              data = path.read_bytes()
              assert data[:4] == b"RIFF" and data[8:12] == b"WEBP", f"{path}: invalid WebP header"
              assert int.from_bytes(data[4:8], "little") + 8 == len(data), f"{path}: truncated or corrupt RIFF"
              assert str(path) in readme, f"{path}: missing from README"
              print(f"Verified {path} ({len(data)} bytes)")
          PY
      - name: GTK UI smoke test (Xvfb)
        run: |
          DATA_HOME="$(mktemp -d)"
          glib-compile-schemas data/
          GSETTINGS_SCHEMA_DIR="$PWD/data" GSETTINGS_BACKEND=memory XDG_DATA_HOME="$DATA_HOME" GDK_BACKEND=x11 PYTHONPATH=src xvfb-run -a dbus-run-session -- bash -c '
            openbox >/tmp/pinplan-openbox.log 2>&1 &
            sleep 1
            /usr/bin/python3 tests/smoke_ui.py
          '
          rm -rf "$DATA_HOME"
      - name: Install into package root
        run: |
          meson setup build --prefix=/usr
          meson compile -C build
          DESTDIR="$PWD/pkg" meson install -C build --no-rebuild
      - name: Build thin DEB
        run: |
          mkdir -p pkg/DEBIAN
          cat > pkg/DEBIAN/control <<'CONTROL'
          Package: pinplan-notes
          Version: 0.4.7
          Provides: betternotes-lite
          Conflicts: betternotes-lite, betternotes
          Replaces: betternotes-lite, betternotes
          Architecture: all
          Maintainer: Community Fork <noreply@github.com>
          Depends: python3 (>= 3.10), python3-gi, gir1.2-gtk-4.0, gir1.2-adw-1, gir1.2-gdkpixbuf-2.0
          Description: PinPlan lightweight bilingual sticky notes and checklists
           GTK4 and Libadwaita sticky notes using distribution shared libraries.
          CONTROL
          # Do not ship redundant Python bytecode, caches or dev artefacts.
          find pkg/usr -type d -name __pycache__ -prune -exec rm -rf {} +
          find pkg/usr -type f -name '*.pyc' -delete
          dpkg-deb --build --root-owner-group pkg pinplan-notes_0.4.7_all.deb
          dpkg-deb --info pinplan-notes_0.4.7_all.deb
          ls -lh *.deb
      - uses: actions/upload-artifact@v4
        with:
          name: pinplan-notes-deb
          path: '*.deb'
      - name: Publish candidate v0.4.7 for feature-branch validation
        if: github.event_name == 'pull_request' && github.head_ref == 'feature/pinplan-v047-markdown-main-home'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.4.7-rc1
          target_commitish: ${{ github.event.pull_request.head.sha }}
          name: PinPlan Notes v0.4.7 (release candidate)
          prerelease: true
          draft: false
          files: pinplan-notes_0.4.7_all.deb
          body: |
            Candidate: dependency-free Markdown read-only preview for ordinary notes,
            and home icon on all full-size note/plan windows. Right-click a collapsed
            ball/pill to reopen the dashboard. Markdown raw source is preserved.
            Simple GTK rendering (not a full CommonMark/HTML/LaTeX engine).
            Please verify on GNOME 50 before a stable release.
