name: PinPlan lightweight DEB CI
on:
  push:
    branches: [main, feature/pinplan-v042-layout-restore-position]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-gi libgtk-4-dev libadwaita-1-dev meson ninja-build gettext libglib2.0-dev-bin gir1.2-gtk-4.0 gir1.2-adw-1 dpkg-dev desktop-file-utils xvfb dbus-x11
      - name: Validate Python and schema
        run: |
          python3 -m compileall -q src/betternotes
          glib-compile-schemas --strict --dry-run data/
          PYTHONPATH=src /usr/bin/python3 -m unittest discover -s tests -v
      - name: GTK UI smoke test (Xvfb)
        run: |
          DATA_HOME="$(mktemp -d)"
          glib-compile-schemas data/
          GSETTINGS_SCHEMA_DIR="$PWD/data" GSETTINGS_BACKEND=memory XDG_DATA_HOME="$DATA_HOME" GDK_BACKEND=x11 PYTHONPATH=src xvfb-run -a dbus-run-session -- /usr/bin/python3 tests/smoke_ui.py
          rm -rf "$DATA_HOME"
      - name: Install into package root
        run: |
          meson setup build --prefix=/usr
          meson compile -C build
          DESTDIR="$PWD/pkg" meson install -C build --no-rebuild
      - name: Build thin DEB
        run: |
          mkdir -p pkg/DEBIAN
          cat > pkg/DEBIAN/control <<'CONTROL'
          Package: pinplan-notes
          Version: 0.4.2
          Provides: betternotes-lite
          Conflicts: betternotes-lite, betternotes
          Replaces: betternotes-lite, betternotes
          Architecture: all
          Maintainer: Community Fork <noreply@github.com>
          Depends: python3 (>= 3.10), python3-gi, gir1.2-gtk-4.0, gir1.2-adw-1, gir1.2-gdkpixbuf-2.0
          Description: PinPlan lightweight bilingual sticky notes and checklists
           GTK4 and Libadwaita sticky notes using distribution shared libraries.
          CONTROL
          # Do not ship redundant Python bytecode, caches or dev artefacts.
          find pkg/usr -type d -name __pycache__ -prune -exec rm -rf {} +
          find pkg/usr -type f -name '*.pyc' -delete
          dpkg-deb --build --root-owner-group pkg pinplan-notes_0.4.2_all.deb
          dpkg-deb --info pinplan-notes_0.4.2_all.deb
          ls -lh *.deb
      - uses: actions/upload-artifact@v4
        with:
          name: betternotes-lite-deb
          path: '*.deb'
      - name: Publish experimental prerelease after successful branch build
        if: (github.event_name == 'push' && github.ref == 'refs/heads/feature/pinplan-v042-layout-restore-position') || (github.event_name == 'pull_request' && github.head_ref == 'feature/pinplan-v042-layout-restore-position')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.4.2-rc1
          target_commitish: ${{ github.event.pull_request.head.sha || github.sha }}
          name: PinPlan Notes v0.4.2 (release candidate)
          prerelease: true
          draft: false
          files: '*.deb'
          body: |
            Candidate with plan footer layout and monitor-aware restoration. Renamed package pinplan-notes replaces betternotes-lite. CI compilation and
            packaging passed; GNOME 50 / Ubuntu 26.04 graphical testing has not
            yet been completed. Backup Snap data before trying this package.
      - name: Publish official stable release after main branch CI
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.4.2
          target_commitish: ${{ github.sha }}
          name: PinPlan Notes v0.4.2
          prerelease: false
          draft: false
          files: 'pinplan-notes_0.4.2_all.deb'
          body: |
            PinPlan Notes 0.4.2 — first official renamed Debian package.
            Improved plan footer and icon-only fold; dual-monitor XWayland
            restore near the current compact handle. Replaces old betternotes-lite.
            Existing user SQLite data and app ID remain unchanged.
      - name: Create GitHub release on tagged builds
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: '*.deb'
          generate_release_notes: true
